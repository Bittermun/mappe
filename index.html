<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mappe Tactical</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>

<body>
  <div id="map"></div>

  <!-- Status Overlay -->
  <div id="overlay">
    <h1>RUHR SECTOR: TACTICAL</h1>
    <div class="stats">
      <div class="stat-item">MODE: <span id="mode-val">SATELLITE</span></div>
      <div class="stat-item">ZOOM: <span id="zoom-val">10</span></div>
    </div>
    <button id="toggle-btn">TOGGLE VIEW</button>
    <button id="settings-btn">⚙ SETTINGS</button>
    <button id="log-toggle-btn">📋 LOG</button>
  </div>

  <!-- Debug Log -->
  <div id="debug-log" class="hidden">
    <div class="log-header">
      <span>RENDER LOG</span>
      <span id="log-stats">Z: 10</span>
    </div>
    <div id="log-content"></div>
  </div>

  <!-- Control Panel -->
  <div id="control-panel" class="hidden">
    <div class="panel-header">
      <h2>LAYER CONTROLS</h2>
      <button id="close-panel">✕</button>
    </div>

    <!-- Contour Controls -->
    <div class="control-section">
      <h3 class="section-header">CONTOURS <span class="collapse-icon">▼</span></h3>
      <div class="section-content">
        <label>
          <span>Opacity</span>
          <input type="range" id="contour-opacity" min="0" max="100" value="60" />
          <span id="contour-opacity-val">60%</span>
        </label>
        <label>
          <span>Width</span>
          <input type="range" id="contour-width" min="1" max="10" value="3" />
          <span id="contour-width-val">3</span>
        </label>
        <label>
          <span>Glow</span>
          <input type="range" id="contour-glow" min="0" max="10" value="2" />
          <span id="contour-glow-val">2</span>
        </label>
      </div>
    </div>

    <!-- Cityscape Controls -->
    <div class="control-section">
      <h3 class="section-header">CITYSCAPE <span class="collapse-icon">▼</span></h3>
      <div class="section-content">
        <label>
          <span>Opacity</span>
          <input type="range" id="city-opacity" min="0" max="100" value="80" />
          <span id="city-opacity-val">80%</span>
        </label>
        <label>
          <span>Glow Intensity</span>
          <input type="range" id="city-glow" min="0" max="10" value="4" />
          <span id="city-glow-val">4</span>
        </label>
      </div>
    </div>

    <!-- Atmosphere Section -->
    <div class="control-section">
      <h3 class="section-header">ATMOSPHERE <span class="collapse-icon">▼</span></h3>
      <div class="section-content">
        <label>
          <span>Glow Style</span>
          <select id="glow-style">
            <option value="soft">Soft</option>
            <option value="neon">Neon</option>
            <option value="hard">Hard Edge</option>
            <option value="subtle">Subtle</option>
            <option value="none">None</option>
          </select>
        </label>
      </div>
    </div>

    <!-- Layer Toggles -->
    <div class="control-section">
      <h3 class="section-header">LAYERS <span class="collapse-icon">▼</span></h3>
      <div class="section-content">
        <div class="toggle-grid">
          <label class="toggle-label">
            <input type="checkbox" id="toggle-contours" checked />
            <span>Contours</span>
          </label>
          <label class="toggle-label">
            <input type="checkbox" id="toggle-cities" checked />
            <span>Cities</span>
          </label>
          <label class="toggle-label">
            <input type="checkbox" id="toggle-water" checked />
            <span>Water</span>
          </label>
          <label class="toggle-label">
            <input type="checkbox" id="toggle-roads" checked />
            <span>Roads</span>
          </label>
          <label class="toggle-label">
            <input type="checkbox" id="toggle-rail" checked />
            <span>Rail</span>
          </label>
          <label class="toggle-label">
            <input type="checkbox" id="toggle-ferry" checked />
            <span>Ferry</span>
          </label>
          <label class="toggle-label">
            <input type="checkbox" id="toggle-borders" checked />
            <span>Borders</span>
          </label>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>

</html>
